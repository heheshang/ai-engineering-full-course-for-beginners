[project]
name = "ai-engineering-full-course-for-beginners"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kiven", email = "kiven@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.7",
    "langchain-deepseek>=1.1.1",
    "loadenv>=0.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.0",
    "langchain-chroma>=1.0",
    "langchain-huggingface>=1.0",
    "langchain-anthropic>=1.0",
    "tiktoken>=0.12.0",
    "pypdf>=6.21.4",
    "langchain-community>=0.4.2",
    "beautifulsoup4>=4.15.0",
    "pandas>=3.1.0",
    "lxml>=6.1.3",
    # tabulate 放宽到 0.9+：deepeval 要求 tabulate<0.10，两者取交集
    "tabulate>=0.9.0",
    "reportlab>=5.1.0",
    "numexpr>=2.14.2",
    "pydantic>=2.12.5",
    "langchain-experimental>=0.4.2",
    "apify-client>=3.4.0",
    "langchain-apify>=0.1.7",
    "crewai>=1.15.33",
    "crewai-tools>=1.15.33",
    "ipython>=9.17.1",
    "tokenizers>=0.23.3",
    "requests>=2.34.2",
    "ddgs>=9.16.1",
    "httpx>=0.28.1",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
    "litellm>=1.106.6",
    # 评测：deepeval 提供 RAG / Agent 的 LLM-as-Judge 指标
    "deepeval>=3.0.0",
]

[project.scripts]
ai-engineering-full-course-for-beginners = "ai_engineering_full_course_for_beginners:main"

[tool.pytest.ini_options]
# evals/ 下的测试需要直接 import 同目录的 eval_config / sut，
# conftest.py 里已经处理了 sys.path。
testpaths = ["evals"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# 标记说明（供 pytest --markers 查看）
markers = [
    "llm_judge: 需要 LLM 裁判模型的用例（未配置凭据时自动跳过）",
    "slow: 耗时较长的用例（需要真实调用模型）",
]

# 默认不收集缓存与临时目录
norecursedirs = [
    ".git",
    ".venv",
    "chroma_db",
    "logs",
    "node_modules",
    "__pycache__",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
