[project]
name = "ai-engineering-full-course-for-beginners"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kiven", email = "kiven@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.7",
    "langchain-deepseek>=1.1.1",
    "loadenv>=0.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.0",
    "langchain-chroma>=1.0",
    "langchain-huggingface>=1.0",
    "langchain-anthropic>=1.0",
    "tiktoken>=0.12.0",
    "pypdf>=6.21.4",
    "langchain-community>=0.4.2",
    "beautifulsoup4>=4.15.0",
    "pandas>=3.1.0",
    "lxml>=6.1.3",
    # tabulate 放宽到 0.9+：deepeval 要求 tabulate<0.10，两者取交集
    "tabulate>=0.9.0",
    "reportlab>=5.1.0",
    "numexpr>=2.14.2",
    "pydantic>=2.12.5",
    "langchain-experimental>=0.4.2",
    "apify-client>=3.4.0",
    "langchain-apify>=0.1.7",
    "crewai>=1.15.33",
    "crewai-tools>=1.15.33",
    "ipython>=9.17.1",
    "tokenizers>=0.23.3",
    "requests>=2.34.2",
    "ddgs>=9.16.1",
    "httpx>=0.28.1",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
    "litellm>=1.106.6",
    # 评测：deepeval 提供 RAG / Agent 的 LLM-as-Judge 指标
    "deepeval>=3.0.0",
]

[project.scripts]
ai-engineering-full-course-for-beginners = "ai_engineering_full_course_for_beginners:main"

[tool.pytest.ini_options]
# evals/ 下的测试需要直接 import 同目录的 eval_config / sut，
# conftest.py 里已经处理了 sys.path。
testpaths = ["evals"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# 标记说明（供 pytest --markers 查看）
markers = [
    "llm_judge: 需要 LLM 裁判模型的用例（未配置凭据时自动跳过）",
    "slow: 耗时较长的用例（需要真实调用模型）",
]

# 默认不收集缓存与临时目录
norecursedirs = [
    ".git",
    ".venv",
    "chroma_db",
    "logs",
    "node_modules",
    "__pycache__",
]

[tool.ruff]
# 统一格式化 / 静态检查配置（全项目共用同一份规则）
target-version = "py314"
line-length = 100
extend-exclude = [
    ".git",
    ".venv",
    "chroma_db",
    "logs",
    "evals/reports",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E4",   # pycodestyle 导入相关
    "E7",   # pycodestyle 语句相关
    "E9",   # pycodestyle 语法错误
    "F",    # pyflakes
    "I",    # isort 导入排序
    "UP",   # pyupgrade 语法现代化
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "RUF",  # ruff 专属规则
]
ignore = [
    # 行宽交给 formatter 处理，避免与 formatter 冲突
    "E501",
    # 演示代码里大量使用「先赋值再在后面使用」的写法
    "RET504",
    "SIM108",
    # 多条 with 合并可读性反而更差
    "SIM117",
    # 函数默认值里调用工具函数是 LangChain 生态的常见写法
    "B008",
    # 类属性是 mutable 的：RAG/Agent 配置里大量使用
    "RUF012",
    # 项目注释与文档全部为中文，全角标点会被误判为「易混淆字符」
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# conftest 需要先改 sys.path 再 import 同目录模块
"evals/conftest.py" = ["E402"]
# 演示脚本把 import 放在讲解注释之后，属于刻意的教学编排
"src/**/*Demo.py" = ["E402"]

[tool.ruff.lint.flake8-pytest-style]
# 项目统一用 "a,b" 字符串形式声明 parametrize 参数名
parametrize-names-type = "csv"

[tool.ruff.lint.isort]
known-first-party = ["utils", "ai_engineering_full_course_for_beginners"]
combine-as-imports = true

[tool.ruff.format]
# 统一格式化风格：双引号、缩进空格、保留魔法尾逗号
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
